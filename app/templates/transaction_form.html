<!DOCTYPE html>
<html lang="{{ lang }}" dir="{% if lang == 'fa' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if is_edit %}{% if lang == 'fa' %}ویرایش معامله{% else %}Edit Transaction{% endif %}{% else %}{% if lang == 'fa' %}ثبت معامله جدید{% else %}New Transaction{% endif %}{% endif %} | E&R Management</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <header class="header">
        <h1>{% if is_edit %}{% if lang == 'fa' %}✏️ ویرایش معامله{% else %}✏️ Edit Transaction{% endif %}{% else %}{% if lang == 'fa' %}📝 ثبت معامله جدید{% else %}📝 New Transaction{% endif %}{% endif %}</h1>
        <a href="{% if is_edit %}/transactions{% else %}/{% endif %}" class="btn-back">🔙 {% if lang == 'fa' %}بازگشت{% else %}Back{% endif %}</a>
    </header>

    <main class="container">
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form action="{% if is_edit %}/transactions/{{ tx.id }}/edit{% else %}/transactions/new{% endif %}" method="post" class="tx-form">
            <!-- فیلد مخفی برای حفظ زبان -->
            <input type="hidden" name="lang" value="{{ lang }}">
            
            <div class="form-group">
                <label for="type">{% if lang == 'fa' %}نوع معامله:{% else %}Transaction Type:{% endif %}</label>
                <select name="type" id="type" required>
                    <option value="income" {% if tx and tx.type == 'income' %}selected{% endif %}>{% if lang == 'fa' %}عاید (Income){% else %}Income{% endif %}</option>
                    <option value="expense" {% if tx and tx.type == 'expense' %}selected{% endif %}>{% if lang == 'fa' %}مصرف (Expense){% else %}Expense{% endif %}</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">{% if lang == 'fa' %}مبلغ (AFN):{% else %}Amount (AFN):{% endif %}</label>
                <input type="number" step="0.01" min="0.01" name="amount" id="amount" required 
                       value="{% if tx %}{{ tx.amount }}{% endif %}" placeholder="1500.50">
            </div>

            <div class="form-group">
                <label for="category">{% if lang == 'fa' %}دسته‌بندی:{% else %}Category:{% endif %}</label>
                <select name="category" id="category" required style="width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px;">
                    <option value="">{% if lang == 'fa' %}-- انتخاب دسته‌بندی --{% else %}-- Select Category --{% endif %}</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if tx and tx.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="transaction_date">{% if lang == 'fa' %}تاریخ:{% else %}Date:{% endif %}</label>
                <input type="date" name="transaction_date" id="transaction_date" required 
                       value="{% if tx %}{{ tx.transaction_date }}{% else %}{{ today }}{% endif %}">
            </div>

            <div class="form-group">
                <label for="description">{% if lang == 'fa' %}توضیحات (اختیاری):{% else %}Description (Optional):{% endif %}</label>
                <textarea name="description" id="description" rows="3">{% if tx and tx.description %}{{ tx.description }}{% endif %}</textarea>
            </div>

            <button type="submit" class="btn-submit">
                {% if is_edit %}{% if lang == 'fa' %}💾 به‌روزرسانی معامله{% else %}💾 Update Transaction{% endif %}{% else %}{% if lang == 'fa' %}💾 ذخیره معامله{% else %}💾 Save Transaction{% endif %}{% endif %}
            </button>
        </form>
    </main>
</body>
</html>
