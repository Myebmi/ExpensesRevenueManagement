<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if is_edit %}ویرایش معامله{% else %}ثبت معامله جدید{% endif %} | E&R Management</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <header class="header">
        <h1>{% if is_edit %}✏️ ویرایش معامله{% else %}📝 ثبت معامله جدید{% endif %}</h1>
        <a href="{% if is_edit %}/transactions{% else %}/{% endif %}" class="btn-back">🔙 بازگشت</a>
    </header>

    <main class="container">
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form action="{% if is_edit %}/transactions/{{ tx.id }}/edit{% else %}/transactions/new{% endif %}" method="post" class="tx-form">
            
            <div class="form-group">
                <label for="type">نوع معامله:</label>
                <select name="type" id="type" required>
                    <option value="income" {% if tx and tx.type == 'income' %}selected{% endif %}>عاید (Income)</option>
                    <option value="expense" {% if tx and tx.type == 'expense' %}selected{% endif %}>مصرف (Expense)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">مبلغ (AFN):</label>
                <input type="number" step="0.01" min="0.01" name="amount" id="amount" required 
                       value="{% if tx %}{{ tx.amount }}{% endif %}" placeholder="مثال: 1500.50">
            </div>

            <div class="form-group">
                <label for="category">دسته‌بندی:</label>
                <input type="text" name="category" id="category" required 
                       value="{% if tx %}{{ tx.category }}{% endif %}" placeholder="مثال: فروش روزانه، اجاره">
            </div>

            <div class="form-group">
                <label for="transaction_date">تاریخ:</label>
                <input type="date" name="transaction_date" id="transaction_date" required 
                       value="{% if tx %}{{ tx.transaction_date }}{% else %}{{ today }}{% endif %}">
            </div>

            <div class="form-group">
                <label for="description">توضیحات (اختیاری):</label>
                <textarea name="description" id="description" rows="3">{% if tx and tx.description %}{{ tx.description }}{% endif %}</textarea>
            </div>

            <button type="submit" class="btn-submit">
                {% if is_edit %}💾 به‌روزرسانی معامله{% else %}💾 ذخیره معامله{% endif %}
            </button>
        </form>
    </main>
</body>
</html>
