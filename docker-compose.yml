
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dukkan_user
      POSTGRES_PASSWORD: dukkan_password
      POSTGRES_DB: dukkan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://dukkan_user:dukkan_password@db:5432/dukkan_db

volumes:
  postgres_data: